<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/tro-oi-icon.svg" />
    <title>Trọ Ơi — Tìm phòng và kết nối cộng đồng</title>
    <script>
      // 1. Tự động hủy mọi Service Worker cũ bị kẹt trên cổng 8443
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
          }
        });
      }

      // 2. Bắt lỗi JavaScript toàn cục và hiển thị ngay nếu có lỗi
      window.addEventListener('error', function(e) {
        var el = document.getElementById('debug-error-box');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-error-box';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fee2e2;color:#991b1b;padding:24px;font-family:monospace;font-size:15px;z-index:999999;overflow:auto;';
          document.body.appendChild(el);
        }
        el.innerHTML += '<h3>[LỖI JAVASCRIPT]: ' + (e.message || 'Unknown error') + '</h3>' +
          '<p><b>File:</b> ' + (e.filename || '') + ' : ' + (e.lineno || '') + ' : ' + (e.colno || '') + '</p>' +
          '<pre style="background:#fff;padding:12px;border:1px solid #f87171;border-radius:6px;overflow:auto;">' + (e.error && e.error.stack ? e.error.stack : 'No stack trace') + '</pre><hr/>';
      });

      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('debug-error-box');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-error-box';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fee2e2;color:#991b1b;padding:24px;font-family:monospace;font-size:15px;z-index:999999;overflow:auto;';
          document.body.appendChild(el);
        }
        el.innerHTML += '<h3>[LỖI PROMISE CHƯA XỬ LÝ]:</h3>' +
          '<pre style="background:#fff;padding:12px;border:1px solid #f87171;border-radius:6px;overflow:auto;">' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason)) + '</pre><hr/>';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
