<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/tro-oi-icon.svg" />
    <title>Trọ Ơi — Tìm phòng và kết nối cộng đồng</title>
    <script>
      // 1. Tự động hủy mọi Service Worker cũ bị kẹt trên cổng 8443
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
          }
        });
      }

      // 2. Bắt lỗi JavaScript toàn cục và hiển thị ngay nếu có lỗi
      window.addEventListener('error', function(e) {
        var el = document.getElementById('debug-error-box');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-error-box';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fee2e2;color:#991b1b;padding:24px;font-family:monospace;font-size:15px;z-index:999999;overflow:auto;';
          document.body.appendChild(el);
        }
        el.innerHTML += '<h3>[LỖI JAVASCRIPT]: ' + (e.message || 'Unknown error') + '</h3>' +
          '<p><b>File:</b> ' + (e.filename || '') + ' : ' + (e.lineno || '') + ' : ' + (e.colno || '') + '</p>' +
          '<pre style="background:#fff;padding:12px;border:1px solid #f87171;border-radius:6px;overflow:auto;">' + (e.error && e.error.stack ? e.error.stack : 'No stack trace') + '</pre><hr/>';
      });

      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('debug-error-box');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-error-box';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fee2e2;color:#991b1b;padding:24px;font-family:monospace;font-size:15px;z-index:999999;overflow:auto;';
          document.body.appendChild(el);
        }
        el.innerHTML += '<h3>[LỖI PROMISE CHƯA XỬ LÝ]:</h3>' +
          '<pre style="background:#fff;padding:12px;border:1px solid #f87171;border-radius:6px;overflow:auto;">' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason)) + '</pre><hr/>';
      });

      // 3. Fallback kiểm tra sau 3.5 giây nếu React chưa render
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.children.length === 0 && !document.getElementById('debug-error-box')) {
            var warn = document.createElement('div');
            warn.id = 'debug-stuck-box';
            warn.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8fafc;font-family:sans-serif;padding:24px;z-index:99999;';
            warn.innerHTML = '<div style="max-width:500px;background:#fff;padding:32px;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.08);text-align:center;">' +
              '<h2 style="color:#245f3b;margin:0 0 12px;">Trọ Ơi — Đang đồng bộ phiên bản mới</h2>' +
              '<p style="color:#64748b;margin:0 0 20px;line-height:1.5;">Trình duyệt của bạn đang lưu phiên cache cũ. Hãy bấm nút bên dưới để xóa dữ liệu tạm và làm mới ngay:</p>' +
              '<button onclick="localStorage.clear();sessionStorage.clear();window.location.reload(true);" style="background:#245f3b;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:15px;">Xóa cache & Làm mới ngay</button>' +
              '</div>';
            document.body.appendChild(warn);
          }
        }, 3000);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
