<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="b1_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D84315"/>
      <stop offset="35%" stop-color="#FF5722"/>
      <stop offset="75%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
    <radialGradient id="b1_glow1" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#FFB74D" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FF7043" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b1_glow2" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#FF8A65" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D84315" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b1_card_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="b1_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="b1_cta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFCA28"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="b1_shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
    <filter id="b1_heavy_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#b1_bg)"/>
  <rect width="1200" height="420" rx="16" fill="url(#b1_glow1)"/>
  <rect width="1200" height="420" rx="16" fill="url(#b1_glow2)"/>

  <!-- Decorative geometric background patterns -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1.5" fill="none">
    <circle cx="950" cy="210" r="160"/>
    <circle cx="950" cy="210" r="230"/>
    <circle cx="950" cy="210" r="300"/>
    <line x1="800" y1="0" x2="1200" y2="400"/>
    <line x1="900" y1="0" x2="1200" y2="300"/>
  </g>

  <!-- LEFT COLUMN: Typography & Value Props -->
  <g transform="translate(60, 48)">
    <!-- Badge -->
    <g>
      <rect x="0" y="0" width="345" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.22" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="16" cy="17" r="5" fill="#FFE082"/>
      <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#FFFFFF" letter-spacing="0.8">CHƯƠNG TRÌNH ĐẶC QUYỀN CHỦ TRỌ 2026</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 52)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" filter="url(#b1_shadow)" letter-spacing="-0.5">
        ĐĂNG TIN DỄ DÀNG
      </text>
      <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="url(#b1_gold)" filter="url(#b1_shadow)" letter-spacing="-0.5">
        LẤP PHÒNG NHANH CHÓNG
      </text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#FFF3E0">
      Tiếp cận trực tiếp hơn 50.000+ sinh viên &amp; người đi làm thuê phòng mỗi tháng
    </text>

    <!-- 3 Benefit Pill Cards -->
    <g transform="translate(0, 180)">
      <!-- Card 1 -->
      <g>
        <rect width="186" height="66" rx="12" fill="url(#b1_card_bg)" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.3" filter="url(#b1_shadow)"/>
        <circle cx="28" cy="33" r="16" fill="#FFFFFF" fill-opacity="0.25"/>
        <text x="21" y="39" font-size="16">🎁</text>
        <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#FFFFFF">TẶNG 3 TIN VIP</text>
        <text x="52" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#FFE0B2">Miễn phí trải nghiệm</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(198, 0)">
        <rect width="198" height="66" rx="12" fill="url(#b1_card_bg)" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.3" filter="url(#b1_shadow)"/>
        <circle cx="28" cy="33" r="16" fill="#FFFFFF" fill-opacity="0.25"/>
        <text x="21" y="39" font-size="16">✓</text>
        <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#FFFFFF">XÁC MINH CHÍNH CHỦ</text>
        <text x="52" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#FFE0B2">Tăng 300% tương tác</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(408, 0)">
        <rect width="194" height="66" rx="12" fill="url(#b1_card_bg)" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.3" filter="url(#b1_shadow)"/>
        <circle cx="28" cy="33" r="16" fill="#FFFFFF" fill-opacity="0.25"/>
        <text x="21" y="39" font-size="16">⚡</text>
        <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#FFFFFF">ĐẨY TIN TỰ ĐỘNG</text>
        <text x="52" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#FFE0B2">Tiếp cận khách gần trọ</text>
      </g>
    </g>

    <!-- Bottom Action Pill / Info -->
    <g transform="translate(0, 270)">
      <rect width="210" height="42" rx="21" fill="url(#b1_cta)" filter="url(#b1_shadow)"/>
      <text x="26" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#BF360C">ĐĂNG TIN NGAY</text>
      <path d="M165 21l-5-5m5 5l-5 5m5-5H142" stroke="#BF360C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="230" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" fill-opacity="0.9">★ Hỗ trợ đăng tin nhanh trong 3 phút</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Professional 3D House & Badges Illustration (Clean Vector) -->
  <g transform="translate(860, 60)">
    <!-- Glow Backdrop -->
    <circle cx="160" cy="150" r="140" fill="#FFFFFF" fill-opacity="0.12" filter="url(#b1_heavy_shadow)"/>

    <!-- Isometric Base / Platform -->
    <path d="M160 280 L290 215 L160 150 L30 215 Z" fill="#D84315" fill-opacity="0.4"/>
    <path d="M30 215 L160 280 L160 300 L30 235 Z" fill="#BF360C" fill-opacity="0.5"/>
    <path d="M290 215 L160 280 L160 300 L290 235 Z" fill="#870000" fill-opacity="0.3"/>

    <!-- Building Model -->
    <!-- Main Wall Left -->
    <polygon points="80,180 160,230 160,110 80,60" fill="#FFFFFF"/>
    <!-- Main Wall Right -->
    <polygon points="160,230 240,180 240,60 160,110" fill="#ECEFF1"/>
    <!-- Roof Left -->
    <polygon points="65,65 160,10 160,25 70,75" fill="#FF7043"/>
    <!-- Roof Right -->
    <polygon points="160,10 255,65 250,75 160,25" fill="#E64A19"/>
    <polygon points="65,65 160,10 255,65 160,110" fill="#FF5722"/>

    <!-- Windows Left (Grid) -->
    <polygon points="95,95 125,112 125,140 95,123" fill="#00897B"/>
    <polygon points="133,117 150,126 150,154 133,145" fill="#00897B"/>
    <polygon points="95,135 125,152 125,180 95,163" fill="#00897B"/>
    <polygon points="133,157 150,166 150,194 133,185" fill="#00897B"/>

    <!-- Windows Right -->
    <polygon points="170,126 198,110 198,138 170,154" fill="#00695C"/>
    <polygon points="206,105 225,94 225,122 206,133" fill="#00695C"/>

    <!-- Entrance Door -->
    <polygon points="172,175 208,155 208,202 172,222" fill="#37474F"/>
    <polygon points="175,178 205,160 205,200 175,218" fill="#546E7A"/>

    <!-- Floating 3D Badge 1: 100% Lấp Phòng -->
    <g transform="translate(160, 40)" filter="url(#b1_heavy_shadow)">
      <rect x="0" y="0" width="136" height="48" rx="10" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="14" fill="#4CAF50"/>
      <path d="M18 24l4 4 8-8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="46" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#1B5E20">98% LẤP PHÒNG</text>
      <text x="46" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#66BB6A">Chỉ trong 7 ngày</text>
    </g>

    <!-- Floating 3D Badge 2: Xác Thực Chính Chủ -->
    <g transform="translate(-10, 160)" filter="url(#b1_heavy_shadow)">
      <rect x="0" y="0" width="128" height="44" rx="10" fill="#FFFFFF"/>
      <circle cx="22" cy="22" r="13" fill="#FF9800"/>
      <text x="17" y="27" font-size="14">🛡️</text>
      <text x="42" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#E65100">CHÍNH CHỦ</text>
      <text x="42" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#757575">Đã xác minh</text>
    </g>

    <!-- Gold Coins Floating -->
    <g transform="translate(40, 24)" filter="url(#b1_shadow)">
      <circle cx="0" cy="0" r="18" fill="url(#b1_gold)"/>
      <circle cx="0" cy="0" r="14" fill="#FFB300" stroke="#FFE082" stroke-width="1.5"/>
      <text x="-4" y="5" font-family="sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">₫</text>
    </g>
    <g transform="translate(290, 180)" filter="url(#b1_shadow)">
      <circle cx="0" cy="0" r="14" fill="url(#b1_gold)"/>
      <circle cx="0" cy="0" r="11" fill="#FFB300" stroke="#FFE082" stroke-width="1"/>
      <text x="-3" y="4" font-family="sans-serif" font-size="11" font-weight="900" fill="#FFFFFF">₫</text>
    </g>
  </g>
</svg>